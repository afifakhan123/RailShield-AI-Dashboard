kind = "web"
previewPath = "/"
title = "RailShield AI Dashboard"
description = "A responsive preventive railway-station safety dashboard for passengers, with simulated station conditions, an expandable safety-score explanation, and a prototype-only SOS confirmation flow."
version = "1.0.0"
id = "artifacts/railshield-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18348

[services.development]
run = "pnpm --filter @workspace/railshield-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/railshield-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/railshield-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18348"
BASE_PATH = "/"
